plugins {
    id 'com.android.application'
}

// CI signs every build with one fixed key (stored in GitHub secrets) so updates install over each
// other. Without the key (local builds, forks) it falls back to Android's default debug key.
def keystorePath = System.getenv('KEYSTORE_PATH')
def useCiKey = keystorePath != null && new File(keystorePath).exists()

android {
    namespace 'app.tvhome'
    compileSdk 34

    defaultConfig {
        applicationId 'app.tvhome'
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName '0.3.0'
    }

    if (useCiKey) {
        signingConfigs {
            ci {
                storeFile file(keystorePath)
                storePassword System.getenv('KEYSTORE_PASSWORD')
                keyAlias System.getenv('KEY_ALIAS')
                keyPassword System.getenv('KEY_PASSWORD')
            }
        }
    }

    buildTypes {
        debug {
            if (useCiKey) {
                signingConfig signingConfigs.ci
            }
        }
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
// No dependencies on purpose: plain Android framework only, so the launcher stays tiny and fast.
